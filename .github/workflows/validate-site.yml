name: Validate Site

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'chapters/**'
      - 'assets/**'
      - 'classic/**'
      - 'play/**'
      - 'play-assets/**'
      - 'play-src/**'
      - 'supabase/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-site.yml'
  pull_request:
    paths:
      - '*.html'
      - 'chapters/**'
      - 'assets/**'
      - 'classic/**'
      - 'play/**'
      - 'play-assets/**'
      - 'play-src/**'
      - 'supabase/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-site.yml'

permissions:
  contents: read

jobs:
  validate:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26.04 between 19 October and 19 November
    # 2026. The browser checks depend on the image's own Chrome, so the move is made deliberately by
    # changing this line and watching one run, not by the label shifting under a push.
    runs-on: ubuntu-24.04
    steps:
      # v5 of both actions runs on Node 24. The v4 runs carried GitHub's deprecation notice for Node 20.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run play:build

      # Last on purpose: a new advisory should not mask a genuine build or test failure.
      # --audit-level=high keeps the gate meaningful rather than permanently red over an
      # informational advisory in a build-only tool.
      - run: npm audit --audit-level=high
