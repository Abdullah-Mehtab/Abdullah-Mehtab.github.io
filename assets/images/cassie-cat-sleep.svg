<svg xmlns="http://www.w3.org/2000/svg" width="160" height="82" viewBox="0 0 160 82" aria-hidden="true">
  <!-- Hello Cassie asleep, curled up on the Cassie theme's footer: the silver tabby seen from the
       side, stripes across the back, head tucked in at the front with eyes shut, a white muzzle
       and paws, the striped tail wrapped round.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe2e8"/>
      <stop offset="1" stop-color="#b3b8c2"/>
    </linearGradient>
  </defs>
  <!-- the body, curled -->
  <path d="M22 72 C14 50, 36 24, 80 23 C124 22, 150 44, 144 66 C141 76, 122 80, 82 80 C48 80, 26 80, 22 72 Z" fill="url(#fur)"/>
  <!-- stripes across the back -->
  <g fill="none" stroke="#3a3d45" stroke-width="4" stroke-linecap="round">
    <path d="M66 28 C68 40, 68 52, 64 62"/>
    <path d="M84 24 C86 36, 86 50, 82 62"/>
    <path d="M102 26 C104 38, 103 50, 99 61"/>
    <path d="M120 33 C121 43, 120 52, 116 60"/>
    <path d="M136 46 C136 52, 134 57, 131 61"/>
  </g>
  <!-- the tail, wrapped round the front of the body, banded -->
  <path d="M140 60 C150 72, 132 78, 106 76 C88 75, 74 76, 66 73" fill="none" stroke="#8f95a1" stroke-width="10" stroke-linecap="round"/>
  <path d="M140 60 C150 72, 132 78, 106 76 C88 75, 74 76, 66 73" fill="none" stroke="#c9cdd5" stroke-width="8" stroke-linecap="round"/>
  <path d="M136 70.5 L141 74 M121 74 L123 79 M106 72.5 L106 79.5 M91 72 L90 79" stroke="#3a3d45" stroke-width="3" stroke-linecap="round"/>
  <!-- white paws tucked under the chin -->
  <ellipse cx="62" cy="76" rx="9" ry="4.5" fill="#f7f7f9"/>
  <!-- the head, tucked in at the front -->
  <path d="M26 48 C24 40, 25 33, 28 28 C33 31, 37 35, 39 39 Z" fill="url(#fur)"/>
  <path d="M52 39 C55 34, 59 31, 64 30 C65 36, 63 42, 60 47 Z" fill="url(#fur)"/>
  <path d="M28.5 42 C28 37, 28.5 33, 30 31 C32.5 33.5, 34.5 36, 35.5 38.5 Z" fill="#f4a9c4"/>
  <path d="M55 40.5 C57 37, 59.5 34.5, 62 33.5 C62.4 37, 61.5 40.5, 59.5 43.5 Z" fill="#f4a9c4"/>
  <path d="M20 60 C20 46, 32 38, 44 38 C57 38, 66 47, 66 59 C66 70, 56 77, 43 77 C30 77, 20 70, 20 60 Z" fill="url(#fur)"/>
  <g fill="none" stroke="#3a3d45" stroke-width="2.4" stroke-linecap="round">
    <path d="M40 40 L41 48 M45 39 L45 47 M50 40 L49 48"/>
    <path d="M22 58 C25 58, 28 59, 30 61"/>
    <path d="M64 57 C61 57, 58 58, 56 60"/>
  </g>
  <path d="M33 66 C33 61, 39 60, 43 63 C47 60, 53 61, 53 66 C53 72, 48 76, 43 76 C38 76, 33 72, 33 66 Z" fill="#f7f7f9"/>
  <!-- eyes shut -->
  <path d="M31 57 Q35 60.5 39 57 M47 57 Q51 60.5 55 57" fill="none" stroke="#2b2d33" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M40.6 64.4 Q43 63.4 45.4 64.4 Q44.2 66.8 43 67.2 Q41.8 66.8 40.6 64.4 Z" fill="#f29bb8"/>
</svg>
