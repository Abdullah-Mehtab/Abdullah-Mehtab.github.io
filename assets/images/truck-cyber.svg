<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Surveillance van">
  <!-- The Cyber theme's vehicle: a black panel van with a dish and a whip antenna on the roof
       and a strip of magenta and purple status lights along its side. Faces right, as every
       vehicle does. The bottom 14px is left clear for wheels-cyber.svg, whose hubs sit at x=17
       and x=66, under the wheel arches drawn here.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <defs>
    <filter id="lit" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the body, with an arch over each wheel -->
  <path d="M3 18.5 L61 18.5 L73.5 29.5 L81.5 31 Q83 31.3 83 33 L83 47 L75 47 A9 9 0 0 0 57 47 L26 47 A9 9 0 0 0 8 47 L3 47 Z" fill="#121016" stroke="#4a3b66" stroke-width="1" stroke-linejoin="round"/>
  <!-- the cab window, with one line of reflected light -->
  <path d="M59 21.5 L62.5 21.5 L71 29.5 L59 29.5 Z" fill="#1f1830" stroke="#4a3b66" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M61.5 23 L66 27.6" stroke="#ff79c6" stroke-width="0.6" opacity="0.5"/>
  <!-- door seams and the bumper -->
  <path d="M56.5 20 L56.5 45.5 M38 20 L38 45.5" stroke="#2c2340" stroke-width="0.8"/>
  <path d="M73 45.5 L83.5 45.5" stroke="#2c2340" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the roof rack, the dish on its post, and the whip antenna -->
  <path d="M8 17 L52 17" stroke="#4a3b66" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M27 17 L27 10.5" stroke="#6b5a8e" stroke-width="1.2"/>
  <g transform="rotate(-24 27 10.5)">
    <path d="M18.5 10.5 C 21 3, 33 2.5, 35.5 9 Z" fill="#241c35" stroke="#7a68a0" stroke-width="0.8" stroke-linejoin="round"/>
    <path d="M27 8.5 L27 3.6" stroke="#8a7bab" stroke-width="0.7"/>
    <circle cx="27" cy="3.4" r="0.9" fill="#bd93f9" filter="url(#lit)"/>
  </g>
  <path d="M47 17 L50.5 1.5" stroke="#8a7bab" stroke-width="0.8" stroke-linecap="round"/>
  <g filter="url(#lit)">
    <circle cx="50.5" cy="1.6" r="1.1" fill="#ff79c6"/>
    <!-- the status lights -->
    <rect x="7" y="33" width="3" height="1.6" rx="0.5" fill="#ff79c6"/>
    <rect x="11.5" y="33" width="3" height="1.6" rx="0.5" fill="#bd93f9"/>
    <rect x="16" y="33" width="3" height="1.6" rx="0.5" fill="#ff79c6"/>
    <rect x="20.5" y="33" width="3" height="1.6" rx="0.5" fill="#3a2c50"/>
    <rect x="25" y="33" width="3" height="1.6" rx="0.5" fill="#bd93f9"/>
    <rect x="29.5" y="33" width="3" height="1.6" rx="0.5" fill="#ff79c6"/>
    <rect x="41" y="33" width="3" height="1.6" rx="0.5" fill="#bd93f9"/>
    <rect x="45.5" y="33" width="3" height="1.6" rx="0.5" fill="#3a2c50"/>
    <rect x="50" y="33" width="3" height="1.6" rx="0.5" fill="#ff79c6"/>
    <!-- head and tail lights -->
    <rect x="80.2" y="34" width="2.6" height="3" rx="0.6" fill="#f4ecff"/>
    <rect x="3.2" y="31" width="1.6" height="4" rx="0.5" fill="#ff5555"/>
  </g>
</svg>
