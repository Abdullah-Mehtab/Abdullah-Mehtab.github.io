<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Ranger jeep carrying a canoe">
  <!-- The Forest theme's vehicle: an old green ranger jeep with a wooden canoe strapped to its
       roof rack. Faces right, as every vehicle does: the scenery scrolls right to left past it,
       and the wind lines in animations.css trail off its left side. The bottom 14px is left
       clear for wheels.svg, whose hubs sit at x=17 and x=66, under the wheel arches drawn here.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <!-- the canoe, hull down on the rack, with its gunwale and two straps -->
  <path d="M1 15.5 C 10 22.5, 72 22.5, 84 15.5 C 70 17.6, 15 17.6, 1 15.5 Z" fill="#a8683c"/>
  <path d="M3 16 C 18 17.9, 67 17.9, 82 16" fill="none" stroke="#d29a62" stroke-width="1.1"/>
  <path d="M22 18.7 L22 25 M61 18.7 L61 25" stroke="#2c2a22" stroke-width="1.4"/>
  <!-- the roof rack -->
  <rect x="14" y="24" width="56" height="1.8" rx="0.6" fill="#2c3326"/>
  <!-- the cabin: a canvas top over the back, the windscreen frame at the front -->
  <path d="M15 26 L56 26 L58.5 34 L15 34 Z" fill="#3e5530"/>
  <path d="M41 27.6 L54.6 27.6 L56.6 33.4 L41 33.4 Z" fill="#9fc3bd" opacity="0.75"/>
  <path d="M19 27.6 L37 27.6 L37 33.4 L19 33.4 Z" fill="#9fc3bd" opacity="0.6"/>
  <!-- the body, the bonnet sloping to the grille, and the arches over both wheels -->
  <path d="M4 34 L66 34 L80 36 L82 46 L3 46 Z" fill="#4f6b3a"/>
  <path d="M58 34 L66 34 L80 36 L80.6 38.5 L58 36.6 Z" fill="#62814a"/>
  <path d="M6.5 46.5 C 7.5 39, 26.5 39, 27.5 46.5 Z M55.5 46.5 C 56.5 39, 75.5 39, 76.5 46.5 Z" fill="#26311f"/>
  <!-- the ranger's badge on the door, the grille and the headlight -->
  <circle cx="44" cy="40" r="2.6" fill="#d9c27a"/>
  <circle cx="44" cy="40" r="1.2" fill="#4f6b3a"/>
  <rect x="80" y="38" width="2.4" height="6.5" rx="0.6" fill="#2c3326"/>
  <circle cx="79" cy="38.6" r="1.4" fill="#f2d27a"/>
  <!-- the spare wheel on the tailgate -->
  <circle cx="3.5" cy="38" r="3.4" fill="#22261e"/>
  <circle cx="3.5" cy="38" r="1.3" fill="#6d7466"/>
</svg>
