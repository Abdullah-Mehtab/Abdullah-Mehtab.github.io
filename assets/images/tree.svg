<svg xmlns="http://www.w3.org/2000/svg" width="35" height="100" viewBox="0 0 35 100" role="img" aria-label="Roadside tree">
  <!-- Intrinsic 35x100 because animations.css sets no background-size for .tree and relies on the
       natural dimensions. Coloured here rather than hue-rotated in CSS: a hue rotation turns the
       whole image one hue, which made the trunk the same green as the needles. -->
  <rect x="15" y="70" width="5" height="30" rx="1" fill="#6b4f34"/>
  <polygon points="4,80 17.5,50 31,80" fill="#1f4d2e"/>
  <polygon points="6,60 17.5,32 29,60" fill="#2a6139"/>
  <polygon points="8,40 17.5,13 27,40" fill="#357245"/>
</svg>
