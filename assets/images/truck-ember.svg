<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Forest service pickup">
  <!-- The Ember theme's vehicle: an old forest service pickup in olive, a rust water tank in the
       bed and an amber beacon on the cab roof, the kind a fire lookout drives up the mountain.
       Faces right, as every vehicle does. The bottom 14px is left clear for wheels.svg, whose
       hubs sit at x=17 and x=66, under the wheel arches drawn here.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <defs>
    <filter id="lit" x="-100%" y="-200%" width="300%" height="500%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- the water tank in the bed, with its bands and filler cap -->
  <rect x="7" y="21.5" width="30" height="10" rx="4.5" fill="#b5531e"/>
  <path d="M15 21.8 L15 31.2 M29 21.8 L29 31.2" stroke="#7e3412" stroke-width="1.2"/>
  <rect x="20.5" y="19" width="3.5" height="3" rx="0.6" fill="#7e3412"/>
  <path d="M9.5 24 L34 24" stroke="#e08a4a" stroke-width="0.8" opacity="0.7"/>
  <!-- the bed -->
  <path d="M3 29 L44 29 L44 46.5 L3 46.5 Z" fill="#5d6a36"/>
  <path d="M3 29.6 L44 29.6" stroke="#7d8a4e" stroke-width="1.2"/>
  <!-- the cab and the hood -->
  <path d="M43 46.5 L43 17.5 Q43 15 45.5 15 L59.5 15 L66 28.5 L81.5 30 Q84 30.4 84 33 L84 46.5 Z" fill="#5d6a36"/>
  <path d="M46 18 L58.2 18 L63.4 28.2 L46 28.2 Z" fill="#f2b45f" opacity="0.88"/>
  <path d="M47.5 26.5 L56.5 19.5" stroke="#fff1d6" stroke-width="0.7" opacity="0.6"/>
  <!-- door seam, a pale shield on the door, and the rust stripe down the side -->
  <path d="M52.5 29 L52.5 45" stroke="#434d25" stroke-width="0.8"/>
  <path d="M56 32 L61 32 L61 35.5 Q61 38 58.5 39 Q56 38 56 35.5 Z" fill="#e9dcc0" opacity="0.85"/>
  <path d="M3 40 L84 40" stroke="#b5531e" stroke-width="2"/>
  <!-- wheel arches -->
  <path d="M7.5 46.6 A9.5 9.5 0 0 1 26.5 46.6 Z M56.5 46.6 A9.5 9.5 0 0 1 75.5 46.6 Z" fill="#2a0d08"/>
  <!-- bumper -->
  <path d="M79 45.5 L85 45.5" stroke="#2a2418" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M2 45.5 L5 45.5" stroke="#2a2418" stroke-width="2.4" stroke-linecap="round"/>
  <g filter="url(#lit)">
    <!-- the beacon on the cab roof, head and tail lights -->
    <rect x="49" y="12" width="6.5" height="3" rx="1" fill="#ffb627"/>
    <rect x="81.6" y="33" width="2.4" height="3.2" rx="0.6" fill="#fff1d6"/>
    <rect x="3" y="31" width="1.6" height="4" rx="0.5" fill="#ff5a36"/>
  </g>
</svg>
