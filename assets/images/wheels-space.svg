    <circle cx="17" cy="7.5" r="6.8" fill="#2d3038" stroke="#c9ccd4" stroke-width="1.1"/>
    <circle cx="66" cy="7.5" r="6.8" fill="#2d3038" stroke="#c9ccd4" stroke-width="1.1"/>
    <g fill="none" stroke="#8d929d" stroke-width="0.6">
      <path d="M17 1.4 L17 13.6 M10.9 7.5 L23.1 7.5 M12.7 3.2 L21.3 11.8 M21.3 3.2 L12.7 11.8"/>
      <path d="M66 1.4 L66 13.6 M59.9 7.5 L72.1 7.5 M61.7 3.2 L70.3 11.8 M70.3 3.2 L61.7 11.8"/>
    </g>
    <circle cx="17" cy="7.5" r="2.2" fill="#dde0e6"/>
    <circle cx="66" cy="7.5" r="2.2" fill="#dde0e6"/>
  </g>
