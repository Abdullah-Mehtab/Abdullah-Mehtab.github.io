<svg xmlns="http://www.w3.org/2000/svg" width="85" height="15" viewBox="0 0 85 15" role="img" aria-label="Lunar rover wheels">
  <!-- The Space theme's wheels, for truck-space.svg: woven wire wheels with chevron treads, as
       a lunar rover had instead of rubber. Same box as wheels.svg, hubs at x=17 and x=66. -->
