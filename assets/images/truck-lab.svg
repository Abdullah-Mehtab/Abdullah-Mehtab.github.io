<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Delivery truck">
  <!-- Faces right: the scenery scrolls right to left past it, and the wind lines in
       animations.css trail off its left side. The bottom 14px is left clear for wheels.svg,
       whose hubs sit at x=17 and x=66, which is where the axle bolts below are placed.

       One truck per theme. The truck art custom property in the lab block of
       portfolio-v2.css points animations.css at this file. Nine parts are painted separately
       rather than one red truck hue rotated in CSS: a rotation moves every colour in a file
       by the same angle, so cab, cargo box, glass and chassis stay locked together and every
       theme got the same flat truck in another shade. The cargo box is pale so it reads
       against this theme's page, and the rear marker sits off the cab's hue so the truck
       carries more than one colour of its own.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <rect x="2" y="10" width="48" height="36" rx="2" fill="#d5dddb"/>
  <rect x="2" y="10" width="48" height="7" rx="2" fill="#e9eceb"/>
  <rect x="5" y="21" width="42" height="1.4" fill="#a0b6b0"/>
  <rect x="26" y="24" width="1.6" height="20" fill="#a0b6b0"/>
  <rect x="5" y="41" width="42" height="3" rx="1" fill="#a0b6b0"/>
  <path d="M50 23 h14 l10 11 h7 a2 2 0 0 1 2 2 v10 H50 Z" fill="#36a184"/>
  <path d="M53 26 h10 l7.5 7.5 H53 Z" fill="#bdd6cf"/>
  <rect x="50" y="40" width="33" height="3" fill="#1d6250"/>
  <rect x="49" y="24" width="1.6" height="22" fill="#2e3e39"/>
  <rect x="2" y="46" width="80" height="3" rx="1" fill="#2e3e39"/>
  <rect x="79" y="37" width="4" height="5" rx="1" fill="#ffe6a8"/>
  <rect x="2" y="40" width="3" height="4" rx="1" fill="#d54db6"/>
  <circle cx="17" cy="48" r="1.2" fill="#a0b6b0"/>
  <circle cx="66" cy="48" r="1.2" fill="#1d6250"/>
</svg>
