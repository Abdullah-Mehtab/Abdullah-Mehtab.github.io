<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Origami delivery truck">
  <!-- Faces right: the scenery scrolls right to left past it, and the wind lines in
       animations.css trail off its left side. The bottom 14px is left clear for the wheels,
       whose hubs sit at x=17 and x=66.

       The Paper theme's vehicle: an origami truck folded from coloured paper, to match the
       folded mountains and trees of its road scene. Every panel is two faces of one fold, a
       lit face and a face in shade, with the crease running between them: a cream paper cargo
       box and a red paper cab. The paper block of portfolio-v2.css points animations.css here.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <!-- cargo box: the side folded across its diagonal, and a lid face catching the light -->
  <path d="M2 14 L50 10 L50 46 L2 46 Z" fill="#efe3c4"/>
  <path d="M2 14 L50 46 L2 46 Z" fill="#dccb9f"/>
  <path d="M2 14 L50 10 L46 7 L5 10.5 Z" fill="#fbf6e3"/>
  <path d="M2 14 L50 46" stroke="#c4b081" stroke-width="0.6"/>
  <!-- cab: folded red paper, the bonnet as its own face -->
  <path d="M50 22 L64 21 L73 33 L50 33 Z" fill="#d1584a"/>
  <path d="M50 33 L73 33 L83 35.5 L83 46 L50 46 Z" fill="#b4463a"/>
  <path d="M73 33 L83 35.5 L50 46 Z" fill="#c24f42" opacity="0.6"/>
  <!-- the window, a paler fold of paper -->
  <path d="M53 24.5 L62.5 24 L69.5 31.5 L53 31.5 Z" fill="#f4ead0"/>
  <path d="M53 31.5 L62.5 24 L69.5 31.5 Z" fill="#e3d6b3"/>
  <!-- chassis strip and the headlight, a folded square of yellow -->
  <path d="M0.5 46 L84.5 46 L84.5 48.5 L0.5 48.5 Z" fill="#6f5b45"/>
  <path d="M79.5 37.5 L82.5 37.5 L82.5 40.5 Z" fill="#f2cf6a"/>
  <path d="M79.5 37.5 L82.5 40.5 L79.5 40.5 Z" fill="#d9b44f"/>
</svg>
