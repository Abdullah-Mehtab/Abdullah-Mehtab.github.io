<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Delivery truck, drawn in pen">
  <!-- Faces right: the scenery scrolls right to left past it, and the wind lines in
       animations.css trail off its left side. The bottom 14px is left clear for the wheels,
       whose hubs sit at x=17 and x=66.

       The Paper theme's vehicle: the same truck, drawn by hand in blue ballpoint on the page.
       Lines overshoot their corners and never quite close, the cargo box is hatched rather than
       filled, and the cab is coloured in with red crayon that misses the edges. The paper block
       of portfolio-v2.css points animations.css at this file.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <g fill="none" stroke="#22336f" stroke-linecap="round" stroke-linejoin="round">
    <!-- red crayon in the cab, a little outside the lines -->
    <path d="M51.5 25 h12 l9.5 10.5 h7 v9.5 H51.5 Z" fill="#c8483a" fill-opacity="0.32" stroke="none"/>
    <path d="M53 29 l8 -3 M53 34 l15 -5 M53 39 l22 -6 M54 43.5 l25 -7.5" stroke="#b83228" stroke-width="1.1" stroke-opacity="0.55"/>
    <!-- cargo box, sketched twice over -->
    <path d="M1.2 10.6 C 17 9.4, 34 10.2, 50.8 9.6" stroke-width="1.7"/>
    <path d="M2.4 9 C 1.8 21, 2.6 34, 2 46.6" stroke-width="1.7"/>
    <path d="M49.6 8.8 C 50.3 22, 49.4 35, 50.2 47" stroke-width="1.7"/>
    <path d="M3 12.2 C 18 11.4, 33 12.6, 48.6 11.8" stroke-width="0.9" stroke-opacity="0.7"/>
    <!-- hatching on the box -->
    <path d="M6 22 l9 -9 M6 31 l18 -18 M6 40 l27 -27 M10 45 l32 -32 M19 45 l28 -28 M28 45 l19 -19 M37 45 l10 -10" stroke-width="0.8" stroke-opacity="0.5"/>
    <!-- cab -->
    <path d="M49.8 23.4 C 54 22.8, 59 23.2, 64.4 22.8 L 74.4 34 L 81.6 34.6 C 83 35.4, 83.2 37, 82.8 39 L 83 46.4" stroke-width="1.7"/>
    <!-- window -->
    <path d="M53.4 26.2 L 62.8 26 L 70.2 33.6 L 53.2 33.8 Z" fill="#fbf6e3" stroke-width="1.3"/>
    <path d="M56 31.5 l4 -4" stroke-width="0.8" stroke-opacity="0.6"/>
    <!-- door line and handle -->
    <path d="M65 35.5 C 65.4 39, 64.8 42, 65.2 45.5 M 60.5 37.8 h 3" stroke-width="1.1"/>
    <!-- chassis -->
    <path d="M0.6 46.8 C 20 46.2, 50 47.4, 84.4 46.4" stroke-width="1.8"/>
    <!-- headlight, scribbled in -->
    <path d="M80.5 37.6 c 1.4 -0.6, 2 0.6, 1.6 2 c -0.5 1.2, -2 1, -1.9 -0.2 c 0.2 -1, 1 -1.1, 1.3 -0.4" stroke="#b83228" stroke-width="1.2"/>
    <!-- a name scrawled on the side of the box -->
    <path d="M10 30.5 c 1.5 -4, 3 -4, 3.2 0 c 0.4 -4, 2.6 -4, 3 0 M 19 28.5 c 1.6 -1.4, 3.2 0.4, 1.4 2 c -1.4 1, 2.6 1.4, 3.6 -0.6 M 26.5 26.8 v 4.2 M 29.5 29 c 1.6 -1.8, 3.4 -0.8, 2.4 1.6" stroke="#b83228" stroke-width="1.1"/>
  </g>
</svg>
