  <path d="M2 100 L2 96 C 2 80, 32 80, 32 96 L32 100 Z" fill="#c9ccd4"/>
  <path d="M6 96 C 7 86, 27 86, 28 96" fill="none" stroke="#9aa0ab" stroke-width="0.9"/>
  <path d="M10 89.5 L24 89.5 M17 83.5 L17 96" stroke="#9aa0ab" stroke-width="0.7"/>
  <rect x="14.5" y="92" width="5" height="4" rx="1" fill="#f0c27a"/>
  <!-- the lander: a gold foil body on four legs, an ascent stage on top -->
  <path d="M38 99.5 L41 92 M57 99.5 L54 92 M42 99.5 L44 92 M53 99.5 L51 92" stroke="#aeb3be" stroke-width="1"/>
  <path d="M36.5 99.5 L39.5 99.5 M55.5 99.5 L58.5 99.5" stroke="#aeb3be" stroke-width="1.2"/>
  <path d="M40 86 L55 86 L56 93 L39 93 Z" fill="#b98d3e"/>
  <path d="M40.6 87 L46 87 L46.6 92.2 L39.9 92.2 Z" fill="#e3c071"/>
  <path d="M42 80 L53 80 L54.5 86 L40.5 86 Z" fill="#c3c7d0"/>
  <rect x="45" y="81.5" width="3" height="2.5" fill="#3b4250"/>
  <path d="M47.5 80 L47.5 75" stroke="#c3c7d0" stroke-width="0.9"/>
</svg>
