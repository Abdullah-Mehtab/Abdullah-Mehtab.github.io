<svg xmlns="http://www.w3.org/2000/svg" width="60" height="100" viewBox="0 0 60 100" aria-hidden="true">
  <!-- Space's roadside base: a small habitat dome with a lit window, and a lander parked beside
       it on four legs. 60x100: the Space scene widens the roadside box to 60px. -->
