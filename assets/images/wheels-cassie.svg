<svg xmlns="http://www.w3.org/2000/svg" width="85" height="15" viewBox="0 0 85 15" role="img" aria-label="Van wheels">
  <!-- The Cassie theme's wheels, for truck-cassie.svg: black tyres with pink hubs. Same box as
       wheels.svg, hubs at x=17 and x=66. -->
