  <circle cx="66" cy="7.5" r="3.4" fill="#ff8cc2"/>
  <circle cx="17" cy="7.5" r="1.2" fill="#ffffff"/>
  <circle cx="66" cy="7.5" r="1.2" fill="#ffffff"/>
</svg>
