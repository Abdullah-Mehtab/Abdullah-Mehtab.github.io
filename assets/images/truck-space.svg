<svg xmlns="http://www.w3.org/2000/svg" width="85" height="60" viewBox="0 0 85 60" role="img" aria-label="Lunar rover">
  <!-- The Space theme's vehicle: a lunar rover, an open aluminium frame with two seats, gold
       foil boxes front and back, and a dish antenna on a mast. Faces right, as every vehicle
       does: the scenery scrolls right to left past it. The bottom 14px is left clear for
       wheels-space.svg, whose hubs sit at x=17 and x=66, under the fenders drawn here.

       Do not write a double hyphen into this comment. SVG is parsed as XML, where a double
       hyphen inside a comment is malformed and makes the whole file render as nothing. -->
  <g fill="none" stroke="#d6d9e0" stroke-linecap="round" stroke-linejoin="round">
    <!-- fenders over both wheels -->
    <path d="M6.5 46.5 C 7.5 39.5, 26.5 39.5, 27.5 46.5" stroke-width="2.2"/>
    <path d="M55.5 46.5 C 56.5 39.5, 75.5 39.5, 76.5 46.5" stroke-width="2.2"/>
    <!-- the frame -->
    <path d="M4 41.5 L80 41.5" stroke-width="2.4"/>
    <path d="M26 41.5 L30 36.5 L52 36.5 L56 41.5" stroke-width="1.4"/>
    <!-- seat backs -->
    <path d="M30.5 36.5 L28.5 26.5 M41.5 36.5 L39.5 26.5" stroke-width="1.6"/>
    <!-- the control post and the antenna mast -->
    <path d="M53 36.5 L55 27" stroke-width="1.4"/>
    <path d="M71 34 L71 14" stroke-width="1.3"/>
    <path d="M64 33.5 L63 21" stroke="#aeb3be" stroke-width="1"/>
  </g>
  <!-- seat webbing -->
  <path d="M28.6 27.5 L30.3 35.5 L37.3 35.5 L35.7 27.5 Z" fill="#5e6c8c"/>
  <path d="M39.6 27.5 L41.3 35.5 L48.3 35.5 L46.7 27.5 Z" fill="#5e6c8c"/>
  <!-- the console -->
  <rect x="52.5" y="23.5" width="6.5" height="4.5" rx="0.8" fill="#9aa0ad"/>
  <!-- gold foil boxes, the warm colour the theme uses for its labels -->
  <rect x="58" y="33" width="20" height="8" rx="1" fill="#b98d3e"/>
  <path d="M58.6 34.2 L65 34.2 L66.5 40 L58.6 40 Z M68 34.2 L77.2 34.2 L77.2 37 L69 38.6 Z" fill="#e3c071" opacity="0.85"/>
  <rect x="4.5" y="33.5" width="16" height="7.5" rx="1" fill="#b98d3e"/>
  <path d="M5.2 34.6 L12 34.6 L13 40.2 L5.2 40.2 Z" fill="#e3c071" opacity="0.8"/>
  <!-- the dish: an open umbrella on the mast, tilted to the sky -->
  <path d="M61.5 13.5 C 64 6.5, 77 5, 81.5 10.5 Z" fill="#eceef2"/>
  <path d="M71 14 L71.6 7.4 M66 12 L71 14 L77 9" fill="none" stroke="#9ea4b0" stroke-width="0.7"/>
  <circle cx="71" cy="14" r="1.2" fill="#c3c7d0"/>
  <!-- the camera at the front -->
  <rect x="76.5" y="29" width="5" height="3.6" rx="0.6" fill="#7d838f"/>
  <circle cx="81.5" cy="30.8" r="1" fill="#bcd0ff"/>
</svg>
